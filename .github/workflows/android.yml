# Builds the dietO Android app on GitHub (no Android Studio needed).
# Actions tab → "Build Android app" → Run workflow. Download the result from the run's "Artifacts".
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON_B64   base64 of android/app/google-services.json (from Firebase) — needed for push notifications
#   KEYSTORE_B64               base64 of your upload keystore (.jks)      — only for the Play Store build
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build Android app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME); accept licences for anything Gradle downloads
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci || npm install
      - name: Firebase config (push notifications)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" }
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > android/app/google-services.json; grep -rl "DIETO_PUSH=false" www | xargs -r sed -i "s/DIETO_PUSH=false/DIETO_PUSH=true/g"; else echo "No google-services.json - push notifications will be off in this build"; fi
      - run: npx cap sync android
      - name: Test build (APK to install on your phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: dieto-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Publish the test APK as a GitHub release (Releases page of this repo)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dietO-test.apk
          TAG="test-build-${{ github.run_number }}"
          gh release create "$TAG" dietO-test.apk --title "dietO test build ${{ github.run_number }}" --notes "Install on Android: download dietO-test.apk and open it (allow installs from this source)." --prerelease
      - name: Also keep the latest APK on the 'builds' branch
        run: |
          mkdir /tmp/b && cp dietO-test.apk /tmp/b/ && cd /tmp/b
          git init -q -b builds && git add dietO-test.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Test APK from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - name: Play Store build (signed AAB)
        env:
          KS: "${{ secrets.KEYSTORE_B64 }}"
          KSP: "${{ secrets.KEYSTORE_PASSWORD }}"
          KA: "${{ secrets.KEY_ALIAS }}"
          KP: "${{ secrets.KEY_PASSWORD }}"
        run: |
          if [ -z "$KS" ]; then echo "No keystore secret - skipping the Play Store build"; exit 0; fi
          echo "$KS" | base64 -d > upload.jks
          cd android && ./gradlew bundleRelease
          jarsigner -keystore ../upload.jks -storepass "$KSP" -keypass "$KP" -sigalg SHA256withRSA -digestalg SHA-256 app/build/outputs/bundle/release/app-release.aab "$KA"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with: { name: dieto-playstore-aab, path: android/app/build/outputs/bundle/release/*.aab }
