<style>
:root{--g900:#123a26;--g800:#1d5a3a;--g700:#22704a;--g600:#2a8a59;--g500:#34a26a;--lime:#8cc63f;--lime2:#b8e07a;--mint:#eef6ee;--mint2:#e2f0e1;
  --ink:#14231b;--ink2:#3d4f45;--mute:#6f8077;--line:#e3ebe5;--bg:#f4f8f3;--amber:#f2b134;--red:#d64545;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input{font-family:inherit}
svg.i{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;stroke:currentColor}
.hidden{display:none!important}
.top{background:linear-gradient(165deg,var(--g900),var(--g700));color:#fff;padding:calc(14px + var(--safe-t)) 18px 58px;border-radius:0 0 28px 28px}
.top .row{display:flex;align-items:center;justify-content:space-between}
.top img.logo{height:30px;display:block}
.top .wm{font-weight:800;font-size:22px;letter-spacing:-.03em}
.top .chip{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:999px;color:var(--lime2)}
.top h1{margin:16px 0 2px;font-size:24px;letter-spacing:-.02em}
.top p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
main{max-width:560px;margin:0 auto;padding:0 14px calc(96px + var(--safe-b))}
.lift{margin-top:-40px}
.card{background:#fff;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 4px 18px rgba(18,58,38,.06)}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}.card h3 svg.i{color:var(--g600);width:19px;height:19px}
.sub{font-size:12.5px;color:var(--mute)}
/* summary ring */
.sum{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:22px;color:var(--g700);letter-spacing:-.02em}.ring .c span{font-size:11px;color:var(--mute);font-weight:600}
.bars{flex:1;display:grid;gap:10px}
.bar .l{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.bar .t{height:9px;background:var(--mint2);border-radius:999px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:999px;background:var(--g600);transition:width .4s}
/* meals */
.meal{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.tile{width:52px;height:52px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--mint2);background-size:cover;background-position:center}
.tile svg.i{width:26px;height:26px;color:var(--g700)}
.mi{flex:1;min-width:0}.sl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g600)}
.nm{font-weight:700;font-size:15px;line-height:1.25}.mm{font-size:12.5px;color:var(--mute)}
.meal.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--lime)}
.ck{width:38px;height:38px;flex:none;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent}
.ck svg.i{width:20px;height:20px}
.meal.done .ck{background:var(--g600);border-color:var(--g600);color:#fff}
.sw{border:0;background:none;color:var(--mute);cursor:pointer;padding:4px;margin-top:2px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.sw svg.i{width:13px;height:13px}
.boost{background:#fff7e5;border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13.5px;color:#7a5200;display:flex;gap:10px;align-items:flex-start}.boost svg.i{color:#b07900;width:20px;height:20px;margin-top:1px}
/* water */
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:36px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#b8c8bd}
.water button.on{background:#e6f3fb;border-color:#9fd0ec;color:#2f8fc4}.water button svg.i{width:20px;height:20px}
.streak{display:flex;align-items:center;gap:12px}.streak .f{width:46px;height:46px;border-radius:14px;background:#fff1e0;display:flex;align-items:center;justify-content:center;color:#e07a10}
.streak .f svg.i{width:24px;height:24px}.streak b{font-size:18px}
/* week tabs */
.dtabs{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 8px;padding:2px 4px 6px;scrollbar-width:none}.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;cursor:pointer;color:var(--ink2);line-height:1.15;position:relative}
.dtabs button b{display:block;font-size:13px}.dtabs button span{font-size:11px;color:var(--mute)}
.dtabs button.on{background:var(--g700);border-color:var(--g700);color:#fff}.dtabs button.on span{color:var(--lime2)}
.dtabs button.today:after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--lime)}
/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;width:100%}
.btn svg.i{width:18px;height:18px}
.btn-g{background:var(--g700);color:#fff}.btn-l{background:var(--lime);color:var(--g900)}.btn-o{background:#fff;color:var(--g800);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inp{width:100%;font-size:18px;font-weight:700;padding:13px 14px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff;color:var(--ink)}
.inp:focus{border-color:var(--g600)}
.irow{display:flex;gap:8px;align-items:stretch}.irow .inp{flex:1}.irow .btn{width:auto;padding:0 18px}
.msg{font-size:13.5px;font-weight:600;margin-top:8px;min-height:18px}.msg.ok{color:var(--g700)}.msg.err{color:var(--red)}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--mint);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:19px;color:var(--g700)}.stats span{font-size:11px;color:var(--mute);font-weight:600}
.hist{margin-top:6px}.hist div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.hist div:first-child{border-top:0}
/* me */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-child{border-top:0}.kv span{color:var(--mute)}.kv b{text-align:right}
.code{display:flex;align-items:center;justify-content:space-between;background:var(--mint);border:1.5px dashed var(--g500);border-radius:14px;padding:10px 14px}
.code b{font-size:22px;letter-spacing:.14em;color:var(--g700)}
.list a,.list button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;border:0;border-top:1px solid var(--line);background:none;text-decoration:none;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.list a:first-child,.list button:first-child{border-top:0}.list svg.i{color:var(--g600);width:20px;height:20px}.list .danger{color:var(--red)}.list .danger svg.i{color:var(--red)}
/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 22px calc(40px + var(--safe-b));max-width:480px;margin:0 auto;text-align:center}
.onb img{height:56px;margin:0 auto 26px;display:block}
.onb h1{font-size:28px;letter-spacing:-.02em;margin:0 0 10px}.onb p{color:var(--ink2);margin:0 0 24px}
.onb .or{margin:22px 0 12px;color:var(--mute);font-size:13px;font-weight:700}
/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b));z-index:20}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mute);text-decoration:none;font-size:11px;font-weight:700}
nav a svg.i{width:23px;height:23px}nav a.on{color:var(--g700)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.offline{background:#fff7e5;color:#7a5200;font-size:12.5px;font-weight:700;text-align:center;padding:6px}
.disc{font-size:11.5px;color:var(--mute);margin:16px 4px 0;line-height:1.5}
</style>
</head>

    m.appendChild(h('div', { class: 'card' }, [h('div', { class: 'streak', html: '<div class="f">' + ic('flame') + '</div><div><b>' + s + '-day streak</b><div class="sub">' + (s ? 'Days in a row with every meal ticked. Keep it going!' : 'Tick all of today’s meals to start your streak.') + '</div></div>' })]));
    m.appendChild(h('a', { class: 'card', href: DietoAuth.href('/consult/'), style: 'display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:linear-gradient(135deg,#1d5a3a,#2a8a59);color:#fff',
      html: '<div style="width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;flex:none">' + ic('message-circle') + '</div>' +
        '<div style="flex:1"><b style="display:block;font-size:16px">Talk to a dietician</b><span style="font-size:13px;color:#d6ecd6">One-to-one chat about your plan, from ₹200</span></div>' + '<span style="font-weight:800;color:#b8e07a">›</span>' }));
    m.appendChild(h('p', { class: 'disc', text: 'General nutrition guidance, not medical advice. Follow your doctor’s advice if you have a medical condition.' }));
    root.appendChild(m);
  }

  var weekSel = null;
  function viewWeek() {
    var ti = todayIdx(); if (weekSel == null) weekSel = ti;
    root.appendChild(header('Your 7-day plan', R.hideNums ? 'Nutritionist-led plan' : R.kcal.toLocaleString('en-IN') + ' kcal · ' + R.p + 'g protein a day'));
    var m = h('main', { class: 'lift' });
    var c = h('div', { class: 'card' });
    var tabs = h('div', { class: 'dtabs' });
    P.WEEK.forEach(function (_, d) {
      tabs.appendChild(h('button', { class: (d === weekSel ? 'on' : '') + (d === ti ? ' today' : ''), html: '<b>Day ' + (d + 1) + '</b><span>' + (d === ti ? 'Today' : dateFor(d).toLocaleDateString('en-IN', { weekday: 'short' })) + '</span>', onclick: function () { weekSel = d; render(); } }));
    });
    c.appendChild(tabs);
    var day = P.WEEK[weekSel], t = totals(day);
    c.appendChild(h('div', { class: 'sub', style: 'font-weight:700;color:var(--g600)', text: dateFor(weekSel).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' }) + (R.hideNums ? '' : ' · ' + t.k.toLocaleString('en-IN') + ' kcal · ' + t.p + 'g protein') }));
    var list = h('div'); day.forEach(function (x, i) { list.appendChild(mealRow(x, weekSel, i, false)); }); c.appendChild(list);
    var b = boostFor(day); if (b) c.appendChild(h('div', { class: 'boost', html: ic('dumbbell') + '<span>' + esc(b) + '</span>' }));
    m.appendChild(c);
    // PDF
    var pc = h('div', { class: 'card' }, [h('h3', { html: ic('clipboard-list') + 'Your plan as a PDF' })]);
    var row = h('div', { class: 'row2' });
    var dl = h('button', { class: 'btn btn-g', html: ic('clipboard-list') + 'Download' });
    var em = h('button', { class: 'btn btn-o', html: ic('mail') + 'Email it' });
    row.appendChild(dl); row.appendChild(em); pc.appendChild(row);
    var box = h('div', { class: 'hidden', style: 'margin-top:10px' });
    var ein = h('input', { class: 'inp', type: 'email', placeholder: 'you@email.com', style: 'font-size:16px;font-weight:500', value: (P.A && P.A.email) || '' });
    var go = h('button', { class: 'btn btn-l', text: 'Send' });
    var msg = h('div', { class: 'msg' });
    box.appendChild(h('div', { class: 'irow' }, [ein, go])); box.appendChild(msg); pc.appendChild(box);
    em.onclick = function () { box.classList.toggle('hidden'); ein.focus(); };
    go.onclick = async function () {
      var v = ein.value.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { msg.className = 'msg err'; msg.textContent = 'Please enter a valid email.'; return; }
      go.disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
      try { var r = await api('', planPayload({ email: v, send_plan: 'yes' })); var d = await r.json(); if (!d.emailed) throw 0; P.A.email = v; store('dieto_plan', P); msg.className = 'msg ok'; msg.textContent = 'Sent! Check your inbox (and Promotions).'; }
      catch (e) { msg.className = 'msg err'; msg.textContent = navigator.onLine ? 'Couldn’t send right now. Try Download instead.' : 'You’re offline. Try again when connected.'; }
      go.disabled = false;
    };
    dl.onclick = async function () {
      dl.disabled = true;
      try {
        var r = await api('pdf', planPayload()); if (!r.ok) throw 0;
        var blob = await r.blob(), url = URL.createObjectURL(blob), a = h('a', { href: url, download: 'dietO-7-day-plan.pdf' });
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      } catch (e) { toast(navigator.onLine ? 'Couldn’t create the PDF. Try again.' : 'Connect to the internet to download the PDF.'); }
      dl.disabled = false;
    };
    m.appendChild(pc);
    root.appendChild(m);
  }

  function weightSeries() {
    // the starting weight from the test stays fixed; logged weights follow it
    return [{ d: P.start, kg: A.kg }].concat(WTS.slice().sort(function (a, b) { return a.d < b.d ? -1 : 1; }));
  }
  function chart(series) {
    var W = 320, H = 150, pl = 34, pr = 10, pt = 12, pb = 22;
    var t0 = parseYmd(series[0].d), lastD = parseYmd(series[series.length - 1].d);
    var spanDays = Math.max(14, dayDiff(t0, lastD) + 7);
    var vals = series.map(function (p) { return p.kg; }); if (R.target) vals.push(R.target);
    var lo = Math.floor(Math.min.apply(null, vals) - 1), hi = Math.ceil(Math.max.apply(null, vals) + 1);
    var X = function (d) { return pl + dayDiff(t0, parseYmd(d)) / spanDays * (W - pl - pr); };
    var Y = function (v) { return pt + (hi - v) / (hi - lo) * (H - pt - pb); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">';
    for (var k = 0; k <= 3; k++) { var v = lo + (hi - lo) * k / 3, y = Y(v); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#e3ebe5"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" font-size="10" fill="#6f8077" text-anchor="end">' + Math.round(v) + '</text>'; }
    if (R.target) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(R.target) + '" y2="' + Y(R.target) + '" stroke="#8cc63f" stroke-width="2" stroke-dasharray="5 5"/><text x="' + (W - pr) + '" y="' + (Y(R.target) - 5) + '" font-size="10" font-weight="700" fill="#2a8a59" text-anchor="end">Goal ' + R.target + ' kg</text>';
    if (R.weeks && R.target) { var endD = new Date(t0); endD.setDate(endD.getDate() + Math.min(spanDays, R.weeks * 7)); var frac = Math.min(1, spanDays / (R.weeks * 7)); var projV = series[0].kg + (R.target - series[0].kg) * frac; s += '<line x1="' + X(series[0].d) + '" y1="' + Y(series[0].kg) + '" x2="' + X(ymd(endD)) + '" y2="' + Y(projV) + '" stroke="#b8c8bd" stroke-width="1.5" stroke-dasharray="3 4"/>'; }
    s += '<polyline fill="none" stroke="#22704a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="' + series.map(function (p) { return X(p.d) + ',' + Y(p.kg); }).join(' ') + '"/>';
    series.forEach(function (p, i) { s += '<circle cx="' + X(p.d) + '" cy="' + Y(p.kg) + '" r="' + (i === series.length - 1 ? 5 : 3.5) + '" fill="' + (i === series.length - 1 ? '#8cc63f' : '#22704a') + '" stroke="#fff" stroke-width="1.5"/>'; });
    s += '<text x="' + pl + '" y="' + (H - 4) + '" font-size="10" fill="#6f8077">' + t0.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + '</text><text x="' + (W - pr) + '" y="' + (H - 4) + '" font-size="10" fill="#6f8077" text-anchor="end">' + lastD.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + '</text></svg>';
    return s;
  }
  function viewProgress() {
    var series = weightSeries(), now = series[series.length - 1].kg, start = series[0].kg, ch = Math.round((now - start) * 10) / 10;
    root.appendChild(header('Your progress', R.target && R.weeks ? E.timelineText(R) : 'Log your weight once a week, same time of day.'));
    var m = h('main', { class: 'lift' });
    var lc = h('div', { class: 'card' }, [h('h3', { html: ic('scale') + 'Log today’s weight' })]);
    var inp = h('input', { class: 'inp', type: 'number', inputmode: 'decimal', step: '0.1', placeholder: 'kg', value: now });
    var btn = h('button', { class: 'btn btn-g', html: 'Save' }), msg = h('div', { class: 'msg' });
    btn.onclick = function () {
      var v = parseFloat(inp.value);
      if (!(v >= 30 && v <= 250)) { msg.className = 'msg err'; msg.textContent = 'Please enter your weight in kg.'; return; }
      v = Math.round(v * 10) / 10; var d = ymd(new Date());
      WTS = WTS.filter(function (w) { return w.d !== d; }); WTS.push({ d: d, kg: v }); store('dieto_weights', WTS);
      ping({ current_kg: v }); toast('Saved: ' + v + ' kg'); render();
    };
    lc.appendChild(h('div', { class: 'irow' }, [inp, btn])); lc.appendChild(msg); m.appendChild(lc);
    var sc = h('div', { class: 'card' });
    sc.appendChild(h('div', { class: 'stats', html: '<div><b>' + start + '</b><span>start (kg)</span></div><div><b>' + now + '</b><span>now (kg)</span></div><div><b>' + (ch > 0 ? '+' : '') + ch + '</b><span>change (kg)</span></div>' }));
    sc.appendChild(h('div', { style: 'margin-top:12px', html: chart(series) }));
    if (!WTS.length) sc.appendChild(h('p', { class: 'sub', style: 'margin:6px 0 0', text: 'Your chart fills in as you log your weight.' }));
    m.appendChild(sc);
    var bmi = Math.round(now / Math.pow(A.cm / 100, 2) * 10) / 10, br = E.bmiRead(bmi);
    if (!R.hideNums) m.appendChild(h('div', { class: 'card', html: '<h3>' + ic('compass') + 'BMI now: ' + bmi + '</h3><p style="margin:0;color:var(--ink2);font-size:14.5px"><b>' + esc(br.label) + '.</b> ' + esc(br.text) + '</p>' }));
    if (WTS.length) {
      var hc = h('div', { class: 'card' }, [h('h3', { html: ic('chart-line') + 'History' })]);
      var hist = h('div', { class: 'hist' });
      WTS.slice().sort(function (a, b) { return a.d < b.d ? 1 : -1; }).slice(0, 12).forEach(function (w) { hist.appendChild(h('div', { html: '<span>' + parseYmd(w.d).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) + '</span><b>' + w.kg + ' kg</b>' })); });
      hc.appendChild(hist); m.appendChild(hc);
    }
    root.appendChild(m);
  }

  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; if (location.hash === '#me') render(); });
  window.addEventListener('appinstalled', function () { ping({ app_installed: 'Yes' }); toast('dietO installed'); });
  function viewMe() {
    root.appendChild(header(P.name || 'You', '+91 ' + P.phone));
    var m = h('main', { class: 'lift' });
    var pc = h('div', { class: 'card' }, [h('h3', { html: ic('user') + 'Your plan' })]);
    var kv = [['Plan', R.identity], ['Daily target', R.hideNums ? 'Set by your nutritionist' : R.kcal.toLocaleString('en-IN') + ' kcal · ' + R.p + 'g protein'], ['Diet', A.pref ? E.PREF_NAME[A.pref] : ''], ['Meals', (A.slots || []).map(function (s) { return E.SLOT_NAME[s]; }).join(', ')], ['Started', parseYmd(P.start).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })]];
    kv.forEach(function (r) { if (r[1]) pc.appendChild(h('div', { class: 'kv', html: '<span>' + r[0] + '</span><b>' + esc(r[1]) + '</b>' })); });
    m.appendChild(pc);
    if (P.code) {
      var cc = h('div', { class: 'card' }, [h('h3', { html: ic('smartphone') + 'Your app code' }), h('p', { class: 'sub', style: 'margin:-4px 0 10px', text: 'Use it to open your plan on another phone.' })]);
      var cb = h('div', { class: 'code' }, [h('b', { text: P.code }), h('button', { class: 'btn btn-o', style: 'width:auto;padding:8px 14px', text: 'Copy', onclick: function () { try { navigator.clipboard.writeText(P.code); toast('Code copied'); } catch (e) {} } })]);
      cc.appendChild(cb); m.appendChild(cc);
    }
    var acc = h('div', { class: 'card' });
    var au = DietoAuth.user();
    if (au) {
      acc.appendChild(h('h3', { html: ic('user') + 'Signed in' }));
      acc.appendChild(h('p', { class: 'sub', style: 'margin:-4px 0 10px', text: '+91 ' + au.phone + ' · your plan and dietician chats are saved to this number.' }));
      acc.appendChild(h('button', { class: 'btn btn-o', text: 'Sign out', onclick: async function () { await DietoAuth.signOut(); toast('Signed out'); render(); } }));
    } else {
      acc.appendChild(h('h3', { html: ic('user') + 'Save your plan to your number' }));
      var aw = h('div'); acc.appendChild(aw);
      DietoAuth.widget(aw, { phone: P.phone, name: P.name, sub: 'Sign in to open your plan and dietician chats on any phone.', onDone: function () { toast('Signed in'); savePlan(); render(); } });
    }
    m.appendChild(acc);
    var lc = h('div', { class: 'card' }); var list = h('div', { class: 'list' });
    if (!STANDALONE && !DietoAuth.native) {
      if (deferredPrompt) list.appendChild(h('button', { html: ic('smartphone') + 'Install the dietO app', onclick: function () { deferredPrompt.prompt(); deferredPrompt = null; } }));
      else if (IS_IOS) list.appendChild(h('button', { html: ic('smartphone') + 'Add to iPhone home screen', onclick: function () { toast('Tap Share, then “Add to Home Screen”'); } }));
    }
    list.appendChild(h('a', { href: C.site + '?chat=1', html: ic('message-circle') + 'Ask dietO AI' }));
    list.appendChild(h('a', { href: DietoAuth.href('/consult/'), html: ic('message-circle') + 'Chat with a dietician' }));
    list.appendChild(h('a', { href: C.site + '?start=1', html: ic('refresh-cw') + 'Retake the diet test' }));
    var del = h('button', { class: 'danger', html: ic('circle-x') + 'Remove my plan from this phone' });
    del.onclick = function () {
      if (!del._armed) { del._armed = true; del.innerHTML = ic('circle-x') + 'Tap again to remove'; setTimeout(function () { del._armed = false; del.innerHTML = ic('circle-x') + 'Remove my plan from this phone'; }, 3000); return; }
      ['dieto_plan', 'dieto_log', 'dieto_weights'].forEach(function (k) { localStorage.removeItem(k); }); P = null; location.hash = ''; render();
    };
    list.appendChild(del); lc.appendChild(list); m.appendChild(lc);
    m.appendChild(h('div', { class: 'card', html: '<h3>' + ic('bike') + 'Meal delivery</h3><p style="margin:0;color:var(--ink2);font-size:14.5px">Launching soon. You’re on the early-access list, and we’ll message +91 ' + esc(P.phone) + ' the day we start delivering near ' + esc(A.pincode || 'you') + '.</p>' }));
    root.appendChild(m);
  }

  function viewOnboard() {
    navEl.classList.add('hidden');
    var o = h('div', { class: 'onb' });
    var logo = h('img', { src: C.logoUrl, alt: 'dietO' }); logo.onerror = function () { logo.replaceWith(h('div', { class: 'wm', style: 'font-size:34px;font-weight:800;color:var(--g700);margin-bottom:20px', text: 'dietO' })); };
    o.appendChild(logo);
    o.appendChild(h('h1', { text: 'Your diet plan, in your pocket' }));
    o.appendChild(h('p', { text: 'Take the free 2-minute AI diet test to build your plan, or sign in to open the plan you already have.' }));
    o.appendChild(h('a', { class: 'btn btn-g', href: C.site + '?start=1', html: ic('sparkles') + 'Take the free diet test' }));
    o.appendChild(h('div', { class: 'or', text: 'ALREADY HAVE A PLAN?' }));
    var sib = h('div', { style: 'text-align:left' }); o.appendChild(sib);
    DietoAuth.widget(sib, { sub: 'Sign in with the mobile number you used for the diet test.', onDone: function (d) {
      if (d.plan) { P = d.plan; P.code = d.code || P.code; store('dieto_plan', P); ping({ app_installed: STANDALONE ? 'Yes' : '' }); location.hash = '#today'; render(); }
      else { sib.innerHTML = '<p style="margin:0;color:var(--ink2);line-height:1.5">You’re signed in, but we didn’t find a plan for this number yet. Take the free diet test to build one.</p>'; }
    } });
    var codeBox = h('div', { class: 'hidden' });
    o.appendChild(h('a', { href: '#', style: 'display:block;margin:14px 0 4px;color:var(--g700);font-weight:700;font-size:14px', text: 'Have an app code instead?', onclick: function (e) { e.preventDefault(); codeBox.classList.toggle('hidden'); } }));
    o.appendChild(codeBox);
    var inp = h('input', { class: 'inp', placeholder: 'App code, e.g. K7Q2MD9P', autocapitalize: 'characters', autocomplete: 'off', style: 'text-align:center;letter-spacing:.12em;text-transform:uppercase' });
    var btn = h('button', { class: 'btn btn-o', style: 'margin-top:8px', text: 'Open my plan' });
    var msg = h('div', { class: 'msg' });
    btn.onclick = async function () {
      var code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length < 6) { msg.className = 'msg err'; msg.textContent = 'Please enter your 8-character app code.'; return; }
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Opening your plan…';
      try {
        var r = await api('restore', { code: code }); var d = await r.json();
        if (!r.ok || !d.plan) throw 0;
        P = d.plan; P.code = d.code; store('dieto_plan', P); ping({ app_installed: STANDALONE ? 'Yes' : '' }); location.hash = '#today'; render();
      } catch (e) { msg.className = 'msg err'; msg.textContent = navigator.onLine ? 'We couldn’t find that code. Check it in your plan email.' : 'You’re offline. Connect to the internet to open your plan.'; }
      btn.disabled = false;
    };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.click(); });
    codeBox.appendChild(inp); codeBox.appendChild(btn); codeBox.appendChild(msg);
    o.appendChild(h('a', { href: DietoAuth.href('/dietician/'), style: 'display:block;margin-top:26px;color:var(--mute);font-size:13px;font-weight:700', text: 'Are you a dietO dietician? Sign in here' }));
    root.appendChild(o);
  }

  var VIEWS = { today: viewToday, week: viewWeek, progress: viewProgress, me: viewMe };
  function render() {
    root.innerHTML = '';
    if (!P || !P.WEEK || !P.R) { viewOnboard(); return; }
    R = P.R; A = P.A || {};
    navEl.classList.remove('hidden');
    var v = (location.hash || '#today').slice(1); if (!VIEWS[v]) v = 'today';
    $$('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + v); });
    VIEWS[v]();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  render();
  // once-a-day "last seen" ping so you can see active users in Brevo / the admin dashboard
  if (P && P.phone && localStorage.getItem('dieto_seen') !== ymd(new Date())) { ping({}); try { localStorage.setItem('dieto_seen', ymd(new Date())); } catch (e) {} }
  if ('serviceWorker' in navigator && !DietoAuth.native) navigator.serviceWorker.register('/sw.js').catch(function () {});
})();
</script>
