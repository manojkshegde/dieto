<style>
:root{--deep:#0B3B26;--g:#146C43;--g6:#1C8452;--lime:#C8F169;--mint:#E3F1E8;--bg:#F3F8F4;--ink:#0F1F17;--ink2:#3D4F46;--mute:#4F6359;--line:#DCE7E0;--amber:#E8A317;--red:#A12D20;--bub:#DFF3C9;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E7EFE9;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:14.5px}
button,input,textarea,select{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;font-weight:800;background:var(--g);color:#fff;text-decoration:none;white-space:nowrap}
.btn.deep{background:var(--deep)}.btn.lime{background:var(--lime);color:var(--deep)}
.btn.ghost{background:#fff;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:8px 14px;font-size:13.5px}.btn.wide{width:100%;padding:15px}
.btn.red{background:#FDE8E6;color:var(--red)}
.btn[disabled]{opacity:.5;pointer-events:none}
.in{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0}
.in:focus{border-color:var(--g6)}
textarea.in{resize:vertical}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;z-index:99;max-width:90vw;text-align:center}
/* app frame */
.app{max-width:560px;margin:0 auto;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(11,59,38,.08)}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.body{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.hd{background:var(--deep);color:#fff;padding:calc(14px + var(--st)) 16px 16px;border-radius:0 0 26px 26px;flex:none;position:relative;z-index:1}
.hd .row{display:flex;align-items:center;gap:12px}
.hd h1{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{margin:6px 0 0;color:#CFE3D7;font-size:13.5px;line-height:1.45}
.hb{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.hb .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--lime)}
.hpill{border:1.5px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.brand{display:flex;align-items:center;gap:10px;flex:1}.brand img{height:26px}
.tagp{background:var(--lime);color:var(--deep);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--mint);color:var(--g);display:grid;place-items:center;font-weight:800;flex:none;position:relative;font-size:15px;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.on::after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#2DBE6C;border:2px solid #fff}
.hd .ava{background:var(--lime);color:var(--deep)}
.onl{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:800}
.sw{width:50px;height:28px;border-radius:999px;border:0;background:rgba(255,255,255,.3);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--lime)}.sw.on::after{transform:translateX(22px);background:var(--deep)}
.sw.lt{background:#C9D6CE}.sw.lt.on{background:var(--g)}.sw.lt.on::after{background:#fff}
/* nav */
.nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--mute);font-size:12px;font-weight:700;border-radius:16px;position:relative}
.nav button svg.i{width:22px;height:22px}
.nav button.on{color:var(--deep);background:var(--mint)}
.badge{position:absolute;top:2px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--g);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.nav .badge{background:var(--red)}
/* cards & lists */
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 12px rgba(11,59,38,.05);margin-bottom:14px}
.card h3,.sh{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.sh{margin:20px 2px 10px}.sh .sp,.card h3 .sp{flex:1}
.sh a,.card h3 a,.lnk{color:var(--g);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats>div{background:#fff;border-radius:18px;padding:12px 10px;box-shadow:0 2px 10px rgba(11,59,38,.05)}
.stats svg.i{color:var(--g);width:20px;height:20px}.stats b{display:block;font-size:20px;margin:6px 0 2px}.stats small{color:var(--mute);font-size:11.5px;line-height:1.25;display:block}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.wait{background:var(--lime);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:6px}
.wait b{font-size:20px;display:block;color:var(--deep)}.wait p{margin:2px 0 10px;color:var(--ink2);font-size:13.5px}
.wait .big{font-size:40px;color:var(--g);flex:none}
.wait.calm{background:#fff;box-shadow:0 2px 12px rgba(11,59,38,.05)}.wait.calm b{font-size:16px}
.li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:#fff;margin-bottom:10px;box-shadow:0 2px 10px rgba(11,59,38,.05);cursor:pointer;width:100%;border:0;text-align:left}
.li .sp{flex:1;min-width:0}
.li b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.li small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;font-size:12px;color:var(--mute)}
.li.hot{box-shadow:0 0 0 2px var(--amber);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(232,163,23,.25)}}
.pill{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--mint);color:var(--g);white-space:nowrap}
.pill.amber{background:#FFF1D6;color:#8A5A00}.pill.red{background:#FDE8E6;color:var(--red)}.pill.grey{background:#EEF2EF;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:#fff;color:var(--ink2);border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px;box-shadow:inset 0 0 0 1.5px var(--line)}
.chips button.on{background:var(--deep);color:#fff;box-shadow:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{border:0;background:#fff;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:12px;color:var(--ink);box-shadow:0 2px 10px rgba(11,59,38,.05);position:relative;line-height:1.25}
.qa svg.i{width:24px;height:24px;color:var(--g)}
.qa .badge{left:auto;right:10px;top:8px}
.none{color:var(--mute);font-size:13.5px;padding:8px 2px;line-height:1.5}
.empty{text-align:center;color:var(--mute);padding:30px 16px;line-height:1.6}
.rows .r{display:flex;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rows .r:first-child{border-top:0}.rows .r .sp{flex:1;min-width:0}.rows .r b{display:block;font-size:14.5px}.rows .r small{color:var(--mute);font-size:12.5px}
.rows .r>svg.i:first-child{color:var(--g);width:22px;height:22px}.rows .r>svg.i:last-child{color:#9DB3A7}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}.kv span{color:var(--mute)}
.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric>div{background:var(--bg);border-radius:16px;padding:12px}.metric small{color:var(--mute);font-size:12px;display:block}.metric b{font-size:19px}
.metric .tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#FFF1D6;color:#8A5A00}
.goal{display:flex;gap:12px;align-items:center;background:var(--lime);border-radius:18px;padding:14px;margin-bottom:14px}.goal small{display:block;font-size:12px;color:var(--ink2)}.goal b{font-size:15px}
.note{display:flex;gap:10px;background:#F2F9E6;border-radius:18px;padding:14px;font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:14px}.note svg.i{color:#8A9A1C;width:22px;height:22px}
.redflag{display:flex;gap:12px;align-items:center;background:#FDE8E6;color:#7A1F15;border-radius:18px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.45}.redflag svg.i{width:22px;height:22px}.redflag .sp{flex:1}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:12px}.tl>div{position:relative;font-size:13.5px}.tl>div::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#9DB3A7}.tl>div:first-child::before{background:var(--g)}.tl b{display:block}.tl small{color:var(--mute)}
.pnote{background:#FFF8E6;border-color:#F3DFB0}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.files a{display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#FDE8E6;color:var(--red);font-weight:800;font-size:11px;text-decoration:none;display:grid;place-items:center;text-align:center;padding:4px}.files img{width:100%;height:100%;object-fit:cover}
.frow{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}.frow:first-child{border-top:0}
.frow .t{width:40px;height:44px;border-radius:10px;background:#FDE8E6;color:var(--red);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.frow .t.img{background:var(--mint);color:var(--g)}
.frow .sp{flex:1;min-width:0}.frow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frow small{color:var(--mute);font-size:12px}
.tabs{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;margin-bottom:14px;box-shadow:0 2px 10px rgba(11,59,38,.05)}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--mute)}.tabs button.on{background:var(--deep);color:#fff}
.hero{background:linear-gradient(135deg,#E3F5D0,#C8F169);border-radius:24px;padding:20px;margin-bottom:14px}
.hero small{color:var(--ink2);font-weight:700;font-size:13px}.hero b{display:block;font-size:34px;letter-spacing:-.02em;color:var(--deep);margin:4px 0}.hero span{font-size:13px;color:var(--ink2)}
.ebars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}.ebars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--mute);height:100%}.ebars i{display:block;width:100%;max-width:40px;border-radius:9px 9px 4px 4px}.ebars .v{font-weight:700;color:var(--ink);font-size:10.5px}
.shgrid{display:grid;grid-template-columns:70px repeat(7,1fr);gap:5px;align-items:center}.shgrid .dh{text-align:center;font-size:11.5px;color:var(--mute);font-weight:700}.shgrid .ph2{font-size:12px;font-weight:700}.shgrid .ph2 small{display:block;color:var(--mute);font-weight:500;font-size:10.5px}
.shgrid .cell{height:34px;border-radius:9px;border:0;background:#EEF3EF}.shgrid .cell.on{background:var(--g)}.shgrid .cell.gap{box-shadow:inset 0 0 0 2px var(--amber)}
.tx{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.tx:first-of-type{border-top:0}.tx .ic{width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--g);display:grid;place-items:center;flex:none}.tx .sp{flex:1;min-width:0}.tx b{display:block;font-size:14px}.tx small{color:var(--mute);font-size:12px}.tx .amt{text-align:right;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:14px}.slot:first-of-type{border-top:0}.slot .sp{flex:1}
.slot .x{border:0;background:none;color:var(--red);padding:6px}
.dayh{margin:14px 0 4px;font-weight:800;font-size:13px;color:var(--g)}
/* chat */
.chd{background:var(--deep);color:#fff;padding:calc(10px + var(--st)) 12px 12px;display:flex;align-items:center;gap:10px;flex:none}
.chd .sp{flex:1;min-width:0}.chd b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chd small{color:#CFE3D7;font-size:12.5px}
.chd .ava{width:38px;height:38px;font-size:13px;background:var(--lime);color:var(--deep)}
.tbar{flex:none;display:flex;align-items:center;gap:8px;background:#EAF7D9;color:var(--deep);font-weight:800;font-size:13.5px;padding:10px 16px;font-variant-numeric:tabular-nums}
.tbar .sp{flex:1}.tbar.low{background:#FFE7B8}
.tbar .end{border:0;background:#fff;color:var(--red);font-weight:800;border-radius:999px;padding:6px 12px;font-size:12.5px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:11px 14px;border-radius:20px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.m.d{align-self:flex-end;background:var(--bub);border-bottom-right-radius:6px}
.m.c{align-self:flex-start;background:#fff;box-shadow:0 1px 4px rgba(18,58,38,.08);border-bottom-left-radius:6px}
.m.sys{align-self:center;color:var(--g);background:var(--mint);font-weight:700;font-size:12px;text-align:center;padding:5px 12px;border-radius:999px}
.m time{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.m.file{padding:6px}.m.file img{display:block;max-width:230px;max-height:270px;border-radius:15px;background:#EEF3EF}
.m.file .pdf{display:flex;gap:10px;align-items:center;padding:6px 8px;color:inherit;text-decoration:none;min-width:200px}
.m.file .pdf span.t{width:40px;height:48px;border-radius:10px;background:#FDE8E6;color:var(--red);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.m.file .pdf b{display:block;font-size:13.5px}.m.file .pdf small{font-size:12px;opacity:.75}.m.file time{padding:0 8px 2px}
.quick{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px 4px;background:#fff;border-top:1px solid var(--line);scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:0;background:var(--mint);color:var(--deep);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700}
.quick .qadd{background:#fff;box-shadow:inset 0 0 0 1.5px #9DB3A7}
.qsel{border:1.5px solid var(--line);border-radius:999px;padding:5px 8px;font-weight:700;font-size:12.5px;background:#fff;flex:none}
.bar{flex:none;display:flex;gap:8px;padding:8px 12px calc(10px + var(--sb));background:#fff;align-items:flex-end}
.bar textarea{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 14px;resize:none;min-height:46px;max-height:140px;outline:0;background:var(--bg)}
.circ{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:var(--mint);color:var(--g)}
.circ.go{background:var(--g);color:#fff}
.cdone{flex:none;padding:14px 16px calc(14px + var(--sb));background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:13.5px}
.over{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.foot{flex:none;padding:12px 16px calc(12px + var(--sb));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
.foot .btn{flex:1;padding:15px}
/* plan builder */
.steps{display:flex;justify-content:space-between;align-items:flex-start;margin:14px 6px 0;position:relative}
.steps::before{content:"";position:absolute;left:12%;right:12%;top:14px;height:2px;background:rgba(255,255,255,.25)}
.steps>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#CFE3D7;font-weight:700;position:relative;z-index:1;flex:1}
.steps i{width:30px;height:30px;border-radius:50%;background:var(--deep);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.steps .on i{background:var(--lime);color:var(--deep);border-color:var(--lime)}.steps .on{color:#fff}
.steps .ok i{background:var(--g);border-color:var(--g)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink2)}
.days button.on{background:var(--g);color:#fff;box-shadow:none}.days button.ok:not(.on){box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g)}
.meal{background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(11,59,38,.05)}
.meal .mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.meal .mh b{flex:1}
.meal .kc{width:96px;border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;text-align:right;outline:0;background:#F2F9E6;font-weight:700}
.meal textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:58px;outline:0;font-size:14px}
.meal textarea:focus,.meal .kc:focus{border-color:var(--g6)}
.dtot{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(11,59,38,.05);margin-bottom:14px;font-weight:800}
.dtot .sp{flex:1}.dtot.ok{background:var(--mint);color:var(--g)}.dtot.off{background:#FFF1D6;color:#8A5A00}
.pthread{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;background:var(--bg);border-radius:16px;padding:10px}.pthread .m{max-width:92%;font-size:13.5px}
.rv{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.rv:first-of-type{border-top:0}.rv .sp{flex:1;min-width:0;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* login */
.login{margin:auto;width:100%;max-width:400px;padding:24px}
.login .lc{background:#fff;border-radius:26px;padding:28px 22px;box-shadow:0 10px 30px rgba(18,58,38,.1)}
.login img{height:34px;display:block;margin:0 auto 14px}
.login h1{text-align:center;margin:0 0 4px;font-size:22px}.login p{text-align:center;color:var(--mute);margin:0 0 18px}
.login .in{margin-bottom:10px}.login .btn{width:100%;padding:14px}
.err{color:var(--red);font-weight:600;margin-top:10px;text-align:center}
@media(min-width:561px){.app{border-radius:0}}
@media (max-width:380px){.stats b{font-size:17px}.qa button{font-size:11px}}
