<!DOCTYPE html>
<html lang="en">
<head>
<script>window.DIETO_BASE='https://dieto.health';window.DIETO_PUSH=false;</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat with a dietician · dietO</title>
<meta name="theme-color" content="#1d5a3a">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g900:#123a26;--g800:#1d5a3a;--g700:#22704a;--g600:#2a8a59;--lime:#8cc63f;--lime2:#b8e07a;--mint:#eef6ee;--mint2:#e2f0e1;
  --ink:#14231b;--ink2:#3d4f45;--mute:#6f8077;--line:#e3ebe5;--bg:#f4f8f3;--amber:#f2b134;--red:#d64545;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:16px}
svg.i{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{background:linear-gradient(165deg,var(--g900),var(--g700));color:#fff;padding:calc(14px + var(--safe-t)) 18px 26px;border-radius:0 0 26px 26px}
.top .row{display:flex;align-items:center;gap:12px}
.top .back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.top img.logo{height:26px}
.top h1{margin:16px 0 4px;font-size:23px;letter-spacing:-.02em;line-height:1.2}
.top p{margin:0;color:#cfe6d4;font-size:14.5px}
.price{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 12px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--lime2)}
main{flex:1;padding:16px 16px calc(24px + var(--safe-b))}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(18,58,38,.06);margin:-6px 0 16px}
.tabs button{border:0;background:none;padding:11px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--g700);color:#fff}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 12px rgba(18,58,38,.06);margin-bottom:12px}
.h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 2px 10px}
.dt{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--mint2);color:var(--g700);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;object-fit:cover;position:relative}
.av.sm{width:38px;height:38px;font-size:14px}
.dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#2fbf71;border:2.5px solid #fff}
.dt b{display:block;font-size:16px}
.dt small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
.dt .sp{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--mint);color:var(--g700);margin-top:4px}
.tag.off{background:#f1f3f2;color:var(--mute)}
.tag.busy{background:#fff3d6;color:#8a6200}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none;background:var(--g700);color:#fff;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.lime{background:var(--lime);color:var(--g900)}
.btn.ghost{background:#fff;color:var(--g700);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.any{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--g800),var(--g600));color:#fff;border-radius:18px;padding:18px;border:0;width:100%;text-align:left;cursor:pointer;box-shadow:0 10px 24px -12px rgba(18,58,38,.6);margin-bottom:12px}
.any .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;flex:none}
.any b{display:block;font-size:16.5px}
.any small{color:#d6ecd6;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:14.5px;line-height:1.5}
.empty .big{font-size:34px;color:var(--g600);margin-bottom:6px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.days button{flex:none;border:0;background:#fff;border-radius:14px;padding:10px 12px;min-width:64px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.days button small{display:block;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.days button b{font-size:18px}
.days button.on{background:var(--g700);color:#fff;box-shadow:none}.days button.on small{color:#cfe6d4}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.times button{border:0;background:var(--mint);color:var(--g800);border-radius:12px;padding:11px 6px;font-weight:700;font-size:14.5px;cursor:pointer}
.times button.on{background:var(--g700);color:#fff}
.sel{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;margin-bottom:12px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:0;font-size:16px}
.in:focus{border-color:var(--g600);box-shadow:0 0 0 4px rgba(42,138,89,.12)}
textarea.in{resize:vertical;min-height:84px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.45;margin:14px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--g700);flex:none;margin-top:1px}
.prof{background:var(--mint);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2);line-height:1.55;margin-top:8px}
.prof b{color:var(--ink)}
.sum{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-weight:700}
.sum span{color:var(--mute);font-weight:600}
.err{color:var(--red);font-weight:600;font-size:14px;margin:10px 0 0}
.note{font-size:12.5px;color:var(--mute);line-height:1.5;margin:10px 2px 0}
.my a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.my a:first-child{border-top:0}
.st{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#f1f3f2;color:var(--mute);white-space:nowrap}
.st.active,.st.waiting{background:#e2f6ea;color:#16865a}.st.booked{background:#e7efff;color:#2b5fc0}.st.refunded{background:#fff3d6;color:#8a6200}
/* chat */
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
.chead{background:linear-gradient(165deg,var(--g900),var(--g700));color:#fff;padding:calc(10px + var(--safe-t)) 14px 12px;display:flex;align-items:center;gap:10px}
.chead .sp{flex:1;min-width:0}.chead b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead small{color:#cfe6d4;font-size:12.5px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:rgba(255,255,255,.14);padding:7px 11px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.timer.low{background:var(--amber);color:var(--g900)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.m{max-width:80%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.c{align-self:flex-end;background:var(--g700);color:#fff;border-bottom-right-radius:5px}
.m.d{align-self:flex-start;background:#fff;box-shadow:0 1px 4px rgba(18,58,38,.08);border-bottom-left-radius:5px}
.m.sys{align-self:center;background:transparent;color:var(--mute);font-size:12.5px;text-align:center;padding:2px 10px;max-width:92%}
.m time{display:block;font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
.bar{background:#fff;border-top:1px solid var(--line);padding:10px 10px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end}
.bar textarea{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;max-height:120px;min-height:46px;resize:none;outline:0}
.bar textarea:focus{border-color:var(--g600)}
.bar .send{width:46px;height:46px;border-radius:14px;border:0;background:var(--g700);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;font-size:18px}
.banner{margin:10px 12px 0;background:#fff7e5;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;color:#6b4a00}
.banner .sp{flex:1}
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:10px}
.pulse{width:86px;height:86px;border-radius:50%;background:var(--mint2);display:grid;place-items:center;color:var(--g700);font-size:34px;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--g600);animation:pl 1.6s ease-out infinite}
@keyframes pl{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}
.wait h2{margin:8px 0 0;font-size:20px}.wait p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.5;max-width:340px}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}
.stars button{border:0;background:none;font-size:32px;color:#d9dee8;cursor:pointer;padding:0;line-height:1}
.stars button.on{color:#f5b301}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--g900);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;max-width:90vw;text-align:center}
.demo{background:#fff3d6;color:#7a5200;font-size:12.5px;font-weight:700;text-align:center;padding:6px}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.DIETO_CONSULT = {
  api: (window.DIETO_BASE || '') + '/api/consult.php',
  logoUrl: '/Logo.png',
  home: '/app/',          // "back" from the chat home
  terms: '/consult/terms.html'
};
</script>
<script src="/dieto-common.js"></script>
<script>
(function () {
  'use strict';
  var C = window.DIETO_CONSULT, root = document.getElementById('root');
  var CFG = null, DT = [], TAB = 'live', POLL = null, CUR = null, LAST = 0, SEEN = {}, TICK = null;

  /* ---------- helpers ---------- */
  var ICONS = {
    back: '<path d="M15 18l-6-6 6-6"/>', chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
    send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>', x: '<path d="M18 6L6 18M6 6l12 12"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', star: '<path d="M12 3l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.6 6.1 20.8l1.3-6.5L2.5 9.8 9.1 9z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M20 6L9 17l-5-5"/>', refund: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
  };
  function ic(n) { return '<svg class="i" viewBox="0 0 24 24">' + (ICONS[n] || '') + '</svg>'; }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === 'html') e.innerHTML = attrs[k]; else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on' && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  async function api(route, body) {
    var ctl = window.AbortController ? new AbortController() : null, tm = ctl && setTimeout(function () { ctl.abort(); }, 20000), r;
    try { r = await fetch(C.api + '?route=' + route, { method: 'POST', headers: DietoAuth.headers(), body: DietoAuth.body(body), signal: ctl ? ctl.signal : undefined }); }
    catch (e) { throw new Error('Couldn’t reach dietO. Please check your internet and try again.'); }
    finally { clearTimeout(tm); }
    var d = {}; try { d = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error(d.error || 'Something went wrong. Please try again.'); err.status = r.status; err.data = d; throw err; }
    return d;
  }
  function toast(t) { var x = el('div', { class: 'toast', text: t }); document.body.appendChild(x); setTimeout(function () { x.remove(); }, 3200); }
  function rs(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
  function initials(n) { return (n || '?').split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
  function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); }
  function fmtWhen(ts) { return new Date(ts * 1000).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function mmss(s) { s = Math.max(0, s | 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function avatar(d, small) {
    var a = d && d.photo ? el('img', { class: 'av' + (small ? ' sm' : ''), src: d.photo, alt: '' }) : el('div', { class: 'av' + (small ? ' sm' : ''), text: initials(d && d.name) });
    if (d && d.online && !small) { var w = el('div', { style: 'position:relative;flex:none' }, [a, el('span', { class: 'dot' })]); return w; }
    return a;
  }
  function mine() { return load('dieto_consults', []); }
  function keyFor(id) { var m = mine().filter(function (x) { return x.id === id; })[0]; return m ? m.key : ''; }

  /* ---------- profile from the diet test (shared only with consent) ---------- */
  var PLAN = load('dieto_plan', null);
  var LBL = {
    gender: { female: 'Female', male: 'Male', other: 'Other' },
    goal: { lose: 'Lose weight', gain: 'Gain muscle', maintain: 'Maintain & eat clean', medical: 'Manage a medical condition', wellness: 'General wellness' },
    activity: { sit: 'Mostly sitting', some: 'On feet sometimes', active: 'Active / daily workouts', athlete: 'Very active' },
    workouts: { none: 'No workouts', w12: '1–2x a week', w35: '3–5x a week', daily: 'Daily' },
    pref: { veg: 'Vegetarian', nonveg: 'Non-vegetarian', egg: 'Eggetarian', vegan: 'Vegan', jain: 'Jain' },
    sleep: { lt5: 'Under 5 h', '5to7': '5–7 h', '7to9': '7–9 h', '9p': '9+ h' },
    conditions: { diabetes: 'Diabetes', pcos: 'PCOS/PCOD', thyroid: 'Thyroid', bp: 'High BP', cholesterol: 'High cholesterol', liver: 'Fatty liver', heart: 'Heart condition' },
    allergies: { nuts: 'Nuts', dairy: 'Dairy', gluten: 'Gluten', shellfish: 'Shellfish', soy: 'Soy', egg: 'Eggs' }
  };
  function lbl(k, v) { if (Array.isArray(v)) return v.filter(function (x) { return x !== 'none' && x !== 'any'; }).map(function (x) { return (LBL[k] && LBL[k][x]) || x; }).join(', '); return (LBL[k] && LBL[k][v]) || v || ''; }
  function profile() {
    if (!PLAN || !PLAN.A) return null;
    var A = PLAN.A, R = PLAN.R || {}, p = {};
    function add(k, v) { if (v !== '' && v != null) p[k] = String(v); }
    add('Age', A.age); add('Gender', lbl('gender', A.gender));
    add('Height', A.cm ? A.cm + ' cm' : ''); add('Weight', A.kg ? A.kg + ' kg' : ''); add('Target weight', A.targetKg ? A.targetKg + ' kg' : '');
    add('Goal', lbl('goal', A.goal)); add('Diet', lbl('pref', A.pref));
    var cond = lbl('conditions', A.conditions || []); if (A.condOther) cond = (cond ? cond + ', ' : '') + A.condOther; add('Conditions', cond || 'None');
    var al = lbl('allergies', A.allergies || []); if (A.allergyOther) al = (al ? al + ', ' : '') + A.allergyOther; add('Allergies', al || 'None');
    add('Medication', A.medication === 'yes' ? 'Yes' + (A.medNote ? ' (' + A.medNote + ')' : '') : A.medication === 'no' ? 'No' : '');
    add('Pregnant/breastfeeding', A.pregnant === 'yes' ? 'Yes' : '');
    add('Activity', lbl('activity', A.activity)); add('Workouts', lbl('workouts', A.workouts)); add('Sleep', lbl('sleep', A.sleep));
    if (R.kcal && !R.hideNums) add('Plan target', R.kcal + ' kcal · ' + R.p + 'g protein');
    if (PLAN.tierName) add('Plan', PLAN.tierName);
    return p;
  }

  /* ---------- home ---------- */
  function stopAll() { clearTimeout(POLL); clearInterval(TICK); POLL = null; CUR = null; }
  async function home() {
    stopAll();
    root.innerHTML = '';
    var top = el('header', { class: 'top' }, [
      el('div', { class: 'row' }, [el('a', { class: 'back', href: DietoAuth.href(C.home), 'aria-label': 'Back to the app', html: ic('back') }), el('img', { class: 'logo', src: C.logoUrl, alt: 'dietO', onerror: 'this.remove()' })]),
      el('h1', { text: 'Talk to a qualified dietician' }),
      el('p', { text: 'One-to-one chat. They can see your diet test, so you get to the point fast.' })
    ]);
    var main = el('main');
    root.appendChild(el('div', { class: 'app' }, [top, main]));
    main.appendChild(el('div', { class: 'empty', text: 'Loading…' }));
    try { var r = await Promise.all([api('config'), api('dieticians')]); CFG = r[0]; DT = r[1].dieticians; }
    catch (e) { main.innerHTML = ''; main.appendChild(el('div', { class: 'card empty', text: 'Could not load dieticians. Check your connection and try again.' })); return; }
    if (CFG.demo) root.prepend(el('div', { class: 'demo', text: 'Test mode: payments are simulated, no money is taken.' }));
    top.appendChild(el('span', { class: 'price', html: ic('zap') + rs(CFG.live.price) + ' for ' + CFG.live.minutes + ' min · extend anytime' }));
    main.innerHTML = '';
    if (!CFG.live_enabled && CFG.slots_enabled) TAB = 'slot'; if (CFG.live_enabled && !CFG.slots_enabled) TAB = 'live';
    if (CFG.live_enabled && CFG.slots_enabled) {
      var tabs = el('div', { class: 'tabs' }, [
        el('button', { class: TAB === 'live' ? 'on' : '', html: ic('chat') + ' Chat now', onclick: function () { TAB = 'live'; home(); } }),
        el('button', { class: TAB === 'slot' ? 'on' : '', html: ic('cal') + ' Book a time', onclick: function () { TAB = 'slot'; home(); } })
      ]);
      main.appendChild(tabs);
    }
    if (!CFG.ready) main.appendChild(el('div', { class: 'card empty', text: 'Dietician chat is launching soon.' }));
    else if (TAB === 'live') liveList(main); else slotPicker(main);
    myList(main);
  }
  function liveList(main) {
    var on = DT.filter(function (d) { return d.online; });
    if (on.length) {

        }
        CUR.foot.appendChild(el('div', { class: 'bar' }, [ta, send]));
        CUR.foot.appendChild(el('div', { style: 'text-align:center;padding:0 0 calc(6px + var(--safe-b));background:#fff' }, [el('button', { style: 'border:0;background:none;color:var(--mute);font-size:12.5px;font-weight:700;cursor:pointer', text: 'End chat', onclick: async function () { if (confirm('End this chat now? Unused time is not refunded.')) { await api('end', { session_id: CUR.id, key: CUR.key }).catch(function () {}); clearTimeout(POLL); refresh(); } } })]));
        setTimeout(function () { try { ta.focus({ preventScroll: true }); } catch (e) {} }, 50);
      } else {
        var box = el('div', { class: 'card', style: 'margin:0;border-radius:18px 18px 0 0;text-align:center;padding-bottom:calc(16px + var(--safe-b))' });
        if (v.status === 'refunded') box.appendChild(el('p', { style: 'margin:0 0 10px;color:var(--mute)', text: 'This chat was refunded.' }));
        else if (!v.rating) {
          box.appendChild(el('b', { text: 'How was your chat?' }));
          var stars = el('div', { class: 'stars' }); var pick = 0;
          for (var i = 1; i <= 5; i++) (function (n) { stars.appendChild(el('button', { 'aria-label': n + ' stars', text: '★', onclick: async function () {
            pick = n; Array.prototype.forEach.call(stars.children, function (s, j) { s.classList.toggle('on', j < n); });
            try { await api('rate', { session_id: CUR.id, key: CUR.key, rating: n }); toast('Thanks for the feedback!'); } catch (e) {}
          } })); })(i);
          box.appendChild(stars);
        } else box.appendChild(el('p', { style: 'margin:0 0 10px;color:var(--mute)', text: 'Thanks for rating this chat.' }));
        box.appendChild(el('a', { class: 'btn block', href: '#', html: ic('plus') + ' Start a new chat' }));
        CUR.foot.appendChild(box);
      }
    }
    // live countdown between polls
    clearInterval(TICK);
    if (v.status === 'active') {
      var endAt = Date.now() + v.remaining * 1000;
      var tick = function () { var r = Math.max(0, Math.round((endAt - Date.now()) / 1000)); if (CUR && CUR.timer) { CUR.timer.lastChild.textContent = mmss(r); CUR.timer.classList.toggle('low', r <= 60); } if (r <= 0) { clearInterval(TICK); clearTimeout(POLL); refresh(); } };
      tick(); TICK = setInterval(tick, 1000);
    } else if (CUR.timer) { CUR.timer.remove(); CUR.timer = null; }
  }
  async function extend() {
    try {
      var o = await api('extend', { session_id: CUR.id, key: CUR.key });
      await payOrder(CUR.id, CUR.key, o.order);
      toast('Extended by ' + CUR.v.ext.minutes + ' minutes'); clearTimeout(POLL); CUR.footMode = ''; refresh();
    } catch (e) { toast(e.message); }
  }
  async function refund() {
    if (!confirm('Cancel this chat and get a full refund?')) return;
    try { await api('refund', { session_id: CUR.id, key: CUR.key }); toast('Refund started'); clearTimeout(POLL); CUR.mode = ''; refresh(); }
    catch (e) { toast(e.message); }
  }

  /* ---------- router ---------- */
  function route() { var m = location.hash.match(/^#s=(\d+)/); if (m) session(+m[1]); else home(); }
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && CUR) { clearTimeout(POLL); refresh(); } });
  route();
})();
</script>
</body>
</html>
