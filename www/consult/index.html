<style>
:root{--g900:#0B3B26;--g800:#0F4A30;--g700:#146C43;--g600:#1C8452;--lime:#C8F169;--lime2:#C8F169;--mint:#E3F1E8;--mint2:#E3F1E8;
  --ink:#0F1F17;--ink2:#3D4F46;--mute:#4F6359;--line:#DCE7E0;--bg:#F3F8F4;--amber:#E8A317;--warm:#FFF4DE;--warmink:#8A5A00;--red:#A12D20;--redbg:#FDE8E6;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
  --sh:0 2px 10px rgba(11,59,38,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--g700)}
svg.i{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{background:var(--g900);color:#fff;padding:calc(16px + var(--safe-t)) 20px 28px;border-radius:0 0 30px 30px}
.top .row{display:flex;align-items:center;gap:12px}
.top .back{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.top img.logo{height:26px}
.top .acct{margin-left:auto;height:42px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px}
.top h1{margin:18px 0 6px;font-size:26px;letter-spacing:-.02em;line-height:1.2;font-weight:800}
.top p{margin:0;color:#CFE3D7;font-size:14.5px;line-height:1.5}
.price{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--lime);color:var(--g900);padding:8px 14px;border-radius:999px;font-weight:800;font-size:13.5px}
main{flex:1;padding:18px 16px calc(24px + var(--safe-b))}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:999px;padding:5px;box-shadow:var(--sh);margin:-12px 0 16px}

.tabs button.on{background:var(--g700);color:#fff}

.pday .r:first-of-type{border-top:0}.pday .r span{color:var(--mute);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pnotes{background:var(--warm);color:#5C3B00;border-radius:20px;padding:14px 16px;margin-bottom:12px;white-space:pre-wrap;line-height:1.55;font-size:14.5px}
@media print{.chead,.chead *,button,.btn,.noprint,.days,.card:not(.pday){display:none!important}.printall{display:block!important}body,.app{background:#fff!important}.pday,.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
.h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:20px 4px 10px}
.dt{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--mint);color:var(--g700);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;object-fit:cover;position:relative}
.av.sm{width:42px;height:42px;font-size:14px}
.dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22A35A;border:2.5px solid #fff}
.dt b{display:block;font-size:16px}
.dt small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
.dt .sp{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mint);color:var(--g700);margin-top:6px}
.tag.off{background:#EEF3EF;color:var(--mute)}
.tag.busy{background:var(--warm);color:var(--warmink)}
.tag.ver{background:var(--lime);color:var(--g900)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px 22px;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none;background:var(--g700);color:#fff;transition:transform .15s,opacity .15s;box-shadow:0 8px 20px -8px rgba(20,108,67,.45)}
.btn:active{transform:scale(.98)}
.btn.lime{background:var(--lime);color:var(--g900);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--red);box-shadow:none}

.btn.block{width:100%}

.any small{color:#CFE3D7;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:14.5px;line-height:1.5}
.empty .big{font-size:34px;color:var(--g600);margin-bottom:6px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.days button{flex:none;border:0;background:#fff;border-radius:16px;padding:10px 12px;min-width:64px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.days button small{display:block;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.days button b{font-size:18px}
.days button.on{background:var(--g700);color:#fff;box-shadow:none}.days button.on small{color:#CFE3D7}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.times button{border:0;background:var(--mint);color:var(--g800);border-radius:999px;padding:11px 6px;font-weight:700;font-size:14.5px;cursor:pointer}
.times button.on{background:var(--g700);color:#fff}
.sel{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;margin-bottom:12px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.in{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;font-size:16px}
.in:focus{border-color:var(--g700);box-shadow:0 0 0 4px rgba(20,108,67,.12)}
textarea.in{resize:vertical;min-height:88px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer}
.chip.on{border-color:var(--g700);background:var(--mint);color:var(--g700);font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.5;margin:14px 0;cursor:pointer;background:var(--bg);border-radius:16px;padding:12px 14px}
.chk input{width:20px;height:20px;accent-color:var(--g700);flex:none;margin-top:1px}
.prof{background:var(--mint);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.6;margin-top:8px}
.prof b{color:var(--ink)}
.sum{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-weight:800;font-size:16px}
.sum span{color:var(--ink2);font-weight:600;font-size:15px}
.sum s{color:var(--mute);font-weight:600;margin-right:6px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:10px 0 0}
.note{font-size:12.5px;color:var(--mute);line-height:1.55;margin:12px 2px 0}
.my a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid #EEF3EF;text-decoration:none;color:var(--ink);font-size:14.5px}
.my a:first-child{border-top:0}
.st{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#EEF3EF;color:var(--mute);white-space:nowrap}
.st.active,.st.waiting{background:var(--mint);color:var(--g700)}.st.booked{background:#E7EFFF;color:#2B5FC0}.st.refunded{background:var(--warm);color:var(--warmink)}.st.plan_done{background:var(--lime);color:var(--g900)}
.rows{background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--sh);margin-bottom:12px}
.rows>a,.rows>button,.rows>div{display:flex;align-items:center;gap:12px;padding:15px 16px;border:0;border-top:1px solid #EEF3EF;background:none;width:100%;text-align:left;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:700;cursor:pointer}
.rows>:first-child{border-top:0}
.rows .ri{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--mint);color:var(--g700);flex:none}
.rows .sp{flex:1;min-width:0}.rows small{display:block;color:var(--mute);font-weight:500;font-size:12.5px;margin-top:2px}
.rows .bad{color:var(--red)}
/* chat */
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
.chead{background:#fff;color:var(--ink);padding:calc(12px + var(--safe-t)) 14px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.chead .back{width:40px!important;height:40px!important;border-radius:13px!important;background:var(--bg)!important;color:var(--ink)!important}
.chead .sp{flex:1;min-width:0}.chead b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead small{color:var(--mute);font-size:12.5px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;background:var(--g900);color:var(--lime);padding:8px 12px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.timer.low{background:var(--amber);color:var(--g900)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{max-width:80%;padding:11px 14px;border-radius:20px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.c{align-self:flex-end;background:var(--g700);color:#fff;border-bottom-right-radius:6px}
.m.d{align-self:flex-start;background:#fff;box-shadow:var(--sh);border-bottom-left-radius:6px}
.m.sys{align-self:center;background:var(--mint);color:var(--g700);font-size:12.5px;font-weight:700;text-align:center;padding:6px 12px;border-radius:999px;max-width:92%}
.m time{display:block;font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
.m.file{padding:6px}
.m.file img{display:block;max-width:220px;max-height:260px;border-radius:15px;background:#EEF3EF}
.m.file .pdf{display:flex;gap:10px;align-items:center;padding:6px 8px;color:inherit;text-decoration:none;min-width:200px}
.m.file .pdf span.t{width:42px;height:50px;border-radius:10px;background:#fff;color:#C0392B;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.m.d.file .pdf span.t{background:var(--redbg)}
.m.file .pdf b{display:block;font-size:14px}.m.file .pdf small{font-size:12px;opacity:.75}
.m.file time{padding:0 8px 2px}
.bar{background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end}
.bar textarea{flex:1;border:1.5px solid var(--line);border-radius:24px;padding:12px 16px;max-height:120px;min-height:48px;resize:none;outline:0;background:var(--bg)}
.bar textarea:focus{border-color:var(--g700);background:#fff}
.bar .send{width:48px;height:48px;border-radius:50%;border:0;background:var(--g700);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;font-size:18px;box-shadow:0 6px 16px rgba(20,108,67,.3)}
.bar .att{width:48px;height:48px;border-radius:50%;border:0;background:var(--mint);color:var(--g700);display:grid;place-items:center;cursor:pointer;flex:none;font-size:19px}
.banner{margin:10px 12px 0;background:var(--warm);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;color:#5C3B00;font-weight:600}
.banner .sp{flex:1}
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:12px}
.wait.dark{background:var(--g900);color:#fff}
.wait.dark p{color:#CFE3D7}.wait.dark .note{color:#CFE3D7}
.pulse{width:110px;height:110px;border-radius:50%;background:var(--g700);display:grid;place-items:center;color:var(--lime);font-size:42px;position:relative;box-shadow:0 0 0 14px rgba(200,241,105,.12)}
.wait:not(.dark) .pulse{background:var(--mint);color:var(--g700);box-shadow:none}
.pulse::after,.pulse::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px solid var(--lime);animation:pl 2.4s ease-out infinite}
.pulse::before{animation-delay:1.2s}
.wait:not(.dark) .pulse::after,.wait:not(.dark) .pulse::before{border-color:var(--g600)}
@keyframes pl{from{transform:scale(.7);opacity:.6}to{transform:scale(1.35);opacity:0}}
.wait h2{margin:10px 0 0;font-size:24px;letter-spacing:-.02em}.wait p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.55;max-width:340px}
.wchip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px}
.wchip b{color:var(--lime)}
.wcard{background:#fff;color:var(--ink);border-radius:24px;padding:16px;width:100%;max-width:360px;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.wcard p{color:var(--mute)!important;font-size:13.5px!important}
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0}
.stars button{border:0;width:52px;height:52px;border-radius:16px;background:var(--warm);color:#E8A317;cursor:pointer;padding:0;display:grid;place-items:center;font-size:26px}
.stars button.on{background:#E8A317;color:#fff}
.sheet{background:#fff;border-radius:30px 30px 0 0;padding:14px 20px calc(20px + var(--safe-b));box-shadow:0 -12px 40px rgba(11,31,23,.18);display:flex;flex-direction:column;gap:14px}
.sheet .handle{align-self:center;width:44px;height:5px;border-radius:999px;background:var(--line)}
.pill{align-self:flex-start;background:var(--lime);color:var(--g900);padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.mini{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:20px;padding:12px 14px}
.mini .sp{flex:1}.mini .pr{text-align:right}.mini .pr b{display:block;font-size:22px;color:var(--g700)}.mini .pr small{font-size:12px;color:var(--mute)}
.offer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);flex-wrap:wrap;gap:8px}
.offer span.o{background:var(--warm);color:var(--warmink);padding:6px 10px;border-radius:999px;font-weight:800}
.linkbtn{border:0;background:none;color:var(--mute);font-size:14.5px;font-weight:700;cursor:pointer;padding:8px}
.whob{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}.whob small{color:var(--g700)!important;font-weight:600}
.fab-ai{position:fixed;right:16px;bottom:calc(20px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--g700);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(11,59,38,.7);z-index:30}.fab-ai svg.i{width:26px;height:26px}
.rows .tg{width:50px;height:30px;border-radius:99px;background:#DCE7E0;position:relative;flex:none;transition:background .2s}.rows .tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}.rows .tg.on{background:var(--g700)}.rows .tg.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--g900);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:99;max-width:90vw;text-align:center}
.demo{background:var(--warm);color:var(--warmink);font-size:12.5px;font-weight:700;text-align:center;padding:6px}
.ov{position:fixed;inset:0;background:rgba(11,31,23,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto}
.att3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.att3 button{height:100px;border-radius:22px;border:0;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.att3 svg.i{width:28px;height:28px}
.inv{font-size:13.5px}.inv .r{display:flex;justify-content:space-between;padding:5px 0}.inv .r.t{font-size:16px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.inv .g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;font-size:12.5px}.inv .g span{color:var(--mute);display:block}
.kv{display:grid;gap:12px;margin:6px 0}
.kv>div{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5}
.kv .ri{width:34px;height:34px;border-radius:11px;background:var(--mint);color:var(--g700);display:grid;place-items:center;flex:none}
@media (prefers-reduced-motion:reduce){.pulse::after,.pulse::before{animation:none}}
</style>
</head>

      g.appendChild(el('button', { class: 'card', 'aria-pressed': l[0] === cur ? 'true' : 'false', style: 'margin:0;text-align:left;cursor:pointer;font:inherit;color:inherit;border:' + (l[0] === cur ? '2px solid var(--g700);background:var(--mint)' : '1.5px solid var(--line)'),
        onclick: async function () { try { await api('set_lang', { lang: l[0] }); if (CFG && CFG.wallet) CFG.wallet.lang = l[0]; toast(l[2] + ' saved'); langPage(); } catch (e) { toast(e.message); } } },
        [el('b', { style: 'display:block;font-size:20px', text: l[1] }), el('small', { style: 'color:var(--mute)', text: l[2] })]));
    });
    var speakers = DT.filter(function (d) { return d.langs; }).map(function (d) { return d.name + ': ' + d.langs; });
    if (speakers.length) main.appendChild(el('p', { class: 'note', text: 'Our dieticians speak — ' + speakers.join(' · ') }));
    main.appendChild(el('p', { class: 'note', text: 'The app itself is in English for now. Your chats can be in any language your dietician speaks.' }));
  }
  /* ---------- consent (asked once per account) ---------- */
  function patchUser(p) { try { var a = JSON.parse(localStorage.getItem('dieto_user')); if (a && a.user) { Object.assign(a.user, p); localStorage.setItem('dieto_user', JSON.stringify(a)); } } catch (e) {} }
  function page(title, backHash, sub) {
    stopAll(); root.innerHTML = '';
    var main = el('main');
    var top = el('header', { class: 'top', style: 'padding-bottom:22px' }, [el('div', { class: 'row' }, [el('a', { class: 'back', href: backHash, 'aria-label': 'Back', html: ic('back') })]),
      el('h1', { style: 'margin-top:14px', text: title }), sub ? el('p', { text: sub }) : null]);
    root.appendChild(el('div', { class: 'app' }, [top, main]));
    return main;
  }
  function consentScreen(done) {
    var main = page('Your health data stays private', '#', 'Before you chat, here is what we keep and who can see it.');
    var c = el('div', { class: 'card' }); main.appendChild(c);
    var kv = el('div', { class: 'kv' });
    [['pdf', '<b>What we keep:</b> your diet test, chats, plans and files you share.'], ['user', '<b>Who sees it:</b> only the dietician you chat with. We never sell it.'],
     ['trash', '<b>Your control:</b> download or delete everything any time from Account.'], ['alert', 'dietO gives diet advice, not medical treatment. For medical problems, see a doctor.']]
      .forEach(function (r) { kv.appendChild(el('div', {}, [el('span', { class: 'ri', html: ic(r[0]) }), el('span', { html: r[1] })])); });
    c.appendChild(kv);
    var cb = el('input', { type: 'checkbox' });
    c.appendChild(el('label', { class: 'chk' }, [cb, el('span', { html: 'I agree to dietO using my health details to give me diet advice, as in the <a href="' + C.terms + '" target="_blank">terms and privacy policy</a>.' })]));
    var err = el('p', { class: 'err hidden', role: 'alert' }); c.appendChild(err);
    var go = el('button', { class: 'btn block', text: 'I agree, continue' }); c.appendChild(go);
    c.appendChild(el('p', { class: 'note', style: 'text-align:center', text: 'Asked once. You can withdraw it in Account › Privacy.' }));
    go.onclick = async function () {
      if (!cb.checked) { err.textContent = 'Please tick the box to continue.'; err.classList.remove('hidden'); return; }
      go.disabled = true;
      try { var r = await api('consent', { agree: true }); patchUser({ consent: r.consent }); done(); }
      catch (e) { go.disabled = false; err.textContent = e.message; err.classList.remove('hidden'); }
    };
  }

  /* ---------- account: payments, invoices, privacy, delete ---------- */
  function needSignIn(main, then) {
    var c = el('div', { class: 'card' }); main.appendChild(c);
    DietoAuth.widget(c, { title: 'Sign in to your account', sub: 'Use your mobile number. We’ll send a code on WhatsApp.', onDone: then });
  }
  async function account() {
    await ensureCfg();
    var AU = DietoAuth.user();
    var main = page(AU ? (AU.name || 'Your account') : 'Your account', '#', AU ? '+91 ' + AU.phone : '');
    if (!AU) return needSignIn(main, account);
    var rows = el('div', { class: 'rows' });
    function row(icon, t, sub, href, bad, onclick) {
      var r = el(href ? 'a' : 'button', { href: href || null, class: bad ? 'bad' : null, onclick: onclick || null }, [el('span', { class: 'ri', style: bad ? 'background:var(--redbg);color:var(--red)' : '', html: ic(icon) }),
        el('span', { class: 'sp' }, [t, sub ? el('small', { text: sub }) : null]), el('span', { html: ic('next'), style: 'color:var(--mute)' })]);
      return r;
    }
    main.appendChild(el('div', { class: 'h', text: 'Account' }));
    rows.appendChild(row('receipt', 'Payments and invoices', 'Download GST invoices', '#pay'));
    rows.appendChild(row('chat', 'My chats and plans', 'All your dietician chats', '#'));
    rows.appendChild(row('zap', 'Minutes and dietO Care', CFG && CFG.wallet ? CFG.wallet.minutes + ' minutes left' + (CFG.wallet.care_until ? ' · Care is on' : '') : 'Packs save you money', '#packs'));
    rows.appendChild(row('star', 'Invite friends', 'You both get free minutes', '#refer'));
    rows.appendChild(row('user', 'Language', ((LANGS.filter(function (l) { return CFG && CFG.wallet && l[0] === CFG.wallet.lang; })[0] || LANGS[0])[2]), '#lang'));
    rows.appendChild(row('bell', 'Notifications', 'Chat, plan, meal, water and progress alerts', '#notifs'));
    main.appendChild(rows);
    main.appendChild(el('div', { class: 'h', text: 'Privacy' }));
    var pr = el('div', { class: 'rows' });
    pr.appendChild(row('lock', 'My data and consent', AU.consent ? 'You agreed on ' + new Date(AU.consent * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Not given yet', '#privacy'));
    pr.appendChild(row('dl', 'Download my data', 'Everything we hold, as a file', null, false, downloadData));
    pr.appendChild(row('trash', 'Delete my account', 'Removes your data for good', '#delete', true));
    main.appendChild(pr);
    main.appendChild(el('button', { class: 'btn ghost block', text: 'Sign out', onclick: async function () { await DietoAuth.signOut(); toast('Signed out'); location.hash = ''; } }));
  }
  async function downloadData() {
    try { var r = await api('my_data'); var u = API_DIR + r.url; if (DietoAuth.native) location.href = u; else window.open(u, '_blank', 'noopener'); toast('Your data file is downloading'); }
    catch (e) { toast(e.message); }
  }
  async function payments() {
    var main = page('Payments and invoices', '#account');
    if (!DietoAuth.user()) return needSignIn(main, payments);
    main.appendChild(el('div', { class: 'empty', text: 'Loading…' }));
    var r; try { r = await api('my_payments'); } catch (e) { main.innerHTML = ''; main.appendChild(el('div', { class: 'card empty', text: e.message })); return; }
    main.innerHTML = '';
    if (!r.payments.length) { main.appendChild(el('div', { class: 'card empty', text: 'No payments yet.' })); return; }
    var rows = el('div', { class: 'rows' });
    r.payments.forEach(function (p) {
      var when = new Date(p.at * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      var amt = el('b', { style: p.status === 'refunded' ? 'color:var(--mute);text-decoration:line-through' : p.amount ? '' : 'color:var(--g700)', text: rs(p.amount) });
      var sub = when + (p.status === 'refunded' ? ' · refunded' : p.invoice ? ' · ' + p.invoice : p.test ? ' · test payment' : p.amount ? '' : ' · no invoice');
      rows.appendChild(el(p.invoice ? 'a' : 'div', { href: p.invoice ? '#inv=' + encodeURIComponent(p.invoice) : null, style: p.invoice ? '' : 'cursor:default' }, [
        el('span', { class: 'sp' }, [p.item, el('small', { text: sub })]), amt, p.invoice ? el('span', { html: ic('next'), style: 'color:var(--mute)' }) : null]));
    });
    main.appendChild(rows);
    main.appendChild(el('p', { class: 'note', text: 'Tap a payment to see its invoice. Refunds reach your account in 5–7 working days.' }));
  }
  async function invoice(no) {
    var main = page('Invoice', '#pay');
    main.appendChild(el('div', { class: 'empty', text: 'Loading…' }));
    var r; try { r = await api('invoice', { no: no }); } catch (e) { main.innerHTML = ''; main.appendChild(el('div', { class: 'card empty', text: e.message })); return; }
    var i = r.invoice; main.innerHTML = '';
    var c = el('div', { class: 'card inv' }); main.appendChild(c);
    function pz(x) { return '₹' + (x / 100).toFixed(2); }
    c.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:flex-start' }, [
      el('div', {}, [el('b', { style: 'font-size:22px;letter-spacing:-.02em', html: 'diet<span style="color:var(--g700)">O</span>' }), el('div', { style: 'font-size:11.5px;color:var(--mute);line-height:1.5', html: esc(i.seller.name) + (i.gstin ? '<br>GSTIN: ' + esc(i.gstin) : '') })]),
      el('span', { class: 'st active', text: 'Paid' })]));
    c.appendChild(el('div', { class: 'g' }, [el('div', { html: '<span>Invoice</span><b>' + esc(i.no) + '</b>' }), el('div', { html: '<span>Date</span><b>' + new Date(i.date * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + '</b>' }),
      el('div', { html: '<span>Billed to</span><b>' + esc(i.name) + '</b>' }), el('div', { html: '<span>Paid via</span><b>' + esc(i.via) + '</b>' })]));
    c.appendChild(el('div', { style: 'border-top:1px dashed var(--line);padding-top:10px' }, [
      el('div', { class: 'r' }, [el('span', { text: i.item }), el('span', { text: pz(i.base) })]),
      i.rate > 0 ? el('div', { class: 'r', style: 'color:var(--mute)' }, [el('span', { text: 'CGST ' + i.rate / 2 + '%' }), el('span', { text: pz(i.cgst) })]) : null,
      i.rate > 0 ? el('div', { class: 'r', style: 'color:var(--mute)' }, [el('span', { text: 'SGST ' + i.rate / 2 + '%' }), el('span', { text: pz(i.sgst) })]) : null,
      el('div', { class: 'r t' }, [el('span', { text: 'Total' }), el('span', { text: pz(i.total) })])]));
    c.appendChild(el('p', { class: 'note', text: i.rate > 0 ? 'Prices include GST.' : 'GST not charged.' }));
    c.appendChild(el('a', { class: 'btn block', style: 'margin-top:12px', href: API_DIR + r.print_url, target: '_blank', rel: 'noopener', html: ic('dl') + ' Download PDF' }));
  }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function privacy() {
    var AU = DietoAuth.user();
    var main = page('My data and consent', '#account');
    if (!AU) return needSignIn(main, privacy);
    var c = el('div', { class: 'card' }); main.appendChild(c);
    c.appendChild(el('div', { class: 'kv' }, [
      el('div', {}, [el('span', { class: 'ri', html: ic('pdf') }), el('span', { html: '<b>What we keep:</b> your diet test, chats, plans and files you share. Shared photos and PDFs are deleted after ' + ((CFG && CFG.file_keep_days) || 90) + ' days.' })]),
      el('div', {}, [el('span', { class: 'ri', html: ic('user') }), el('span', { html: '<b>Who sees it:</b> only the dietician you chat with, and dietO support if you ask us for help.' })]),
      el('div', {}, [el('span', { class: 'ri', html: ic('receipt') }), el('span', { html: '<b>Invoices</b> are kept as tax law requires, even if you delete your account.' })])]));
    c.appendChild(el('div', { class: 'sum', style: 'margin-top:10px' }, [el('span', { text: 'Consent' }), el('b', { text: AU.consent ? 'Given' : 'Not given' })]));
    if (AU.consent) c.appendChild(el('button', { class: 'btn ghost block', text: 'Withdraw consent', onclick: async function () {
      if (!confirm('Withdraw consent? You won’t be able to start new chats until you agree again. Your past chats stay until you delete your account.')) return;
      try { await api('consent', { agree: false }); patchUser({ consent: 0 }); toast('Consent withdrawn'); privacy(); } catch (e) { toast(e.message); } } }));
    main.appendChild(el('button', { class: 'btn ghost block', style: 'margin-top:6px', html: ic('dl') + ' Download my data', onclick: downloadData }));
  }
  function deleteAccount() {
    var AU = DietoAuth.user();
    var main = page('Delete your account?', '#account', 'This removes everything and can’t be undone.');
    if (!AU) return needSignIn(main, deleteAccount);
    var c = el('div', { class: 'card' }); main.appendChild(c);
    c.appendChild(el('ul', { style: 'margin:0 0 12px;padding:14px 16px 14px 34px;background:var(--bg);border-radius:18px;display:grid;gap:8px;font-size:14px;line-height:1.45', html:
      '<li>Your profile, diet test and plans</li><li>All chats, photos and reports you shared</li><li>Unused chat minutes (no refund)</li>' }));
    c.appendChild(el('p', { class: 'note', style: 'margin:0 0 12px', text: 'Payment invoices are kept as tax law requires. They hold only your name, number and the amount.' }));
    var box = el('div'); c.appendChild(box);
    DietoAuth.widget(box, { phone: AU.phone, title: 'Confirm it’s you', sub: 'We’ll send a code to +91 ' + AU.phone + ' on WhatsApp.', onDone: function () { ready(); } });
    function ready() {
      box.innerHTML = '';
      var err = el('p', { class: 'err hidden', role: 'alert' }); box.appendChild(err);
      var del = el('button', { class: 'btn danger block', html: ic('trash') + ' Delete my account' }); box.appendChild(del);
      del.onclick = async function () { go(false); };
      async function go(force) {
        del.disabled = true;
        try { await api('delete_account', { force: force }); }
        catch (e) {
          del.disabled = false;
          if (e.data && e.data.busy && confirm(e.message + '\n\nDelete anyway?')) return go(true);
          if (e.data && e.data.reauth) return deleteAccount();
          err.textContent = e.message; err.classList.remove('hidden'); return;
        }
        ['dieto_user', 'dieto_plan', 'dieto_consults', 'dieto_log', 'dieto_weights', 'dieto_push_token'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
        var m2 = page('Account deleted', '#');
        m2.appendChild(el('div', { class: 'card empty' }, [el('div', { class: 'big', html: ic('check') }), el('div', { text: 'Your account and health data have been removed. Thank you for trying dietO.' })]));
        m2.appendChild(el('a', { class: 'btn block', href: DietoAuth.href(C.home), text: 'Back to dietO' }));
      }
    }
    main.appendChild(el('a', { class: 'btn ghost block', href: '#account', text: 'Keep my account' }));
  }

  /* ---------- router ---------- */
  function route() {
    var h = location.hash, m = h.match(/^#s=(\d+)/), n = h.match(/^#inv=(.+)$/);
    if (m) session(+m[1]); else if (n) invoice(decodeURIComponent(n[1]));
    else if (h === '#notifs') notifsPage();
    else if (h.indexOf('#d=') === 0) profilePage(+h.slice(3)); else if (h === '#packs') packsPage(); else if (h === '#refer') referPage(); else if (h === '#lang') langPage();
    else if (h === '#account') account(); else if (h === '#pay') payments(); else if (h === '#privacy') privacy(); else if (h === '#delete') deleteAccount();
    else home();
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && CUR) { clearTimeout(POLL); refresh(); } });
  route();
})();
</script>
</body>
</html>
